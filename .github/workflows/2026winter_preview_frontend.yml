
name: 2026winter Deploy - Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "2026winter/frontend/**"

permissions:
  contents: read
  deployments: write

# 同じPRに短時間で複数回pushされた場合、
# 古いPreviewデプロイをキャンセルして最新のものだけを実行する
concurrency:
  group: 2026winter-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # ForkからのPRにはCloudflareの認証情報を渡さない
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # リポジトリをチェックアウトしたあとに
          # トークンなどの認証情報をGitのconfigに残さない
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "2026winter/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "2026winter/frontend"

      # GitHubのPreview Deploymentを作成
      #
      # Previewは複数のPull Requestが同時に存在するため、
      # jobのenvironmentではなくDeployment APIを使用して明示的に作成する
      - name: Create GitHub Preview deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          response=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            --input - <<EOF
          {
            "ref": "${PR_REF}",
            "environment": "2026winter-preview",
            "description": "Preview for Pull Request #${PR_NUMBER}",
            "required_contexts": [],
            "auto_merge": false,
            "transient_environment": true,
            "production_environment": false
          }
          EOF
          )

          deployment_id=$(echo "$response" | jq -er '.id')

          echo "Created deployment: $deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      # Deploymentを「実行中」にする
      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f description="Deploying Preview to Cloudflare."

      # フロントエンドのビルド用環境変数を設定する
      - name: Create .env.production
        working-directory: "2026winter/frontend"
        env:
          EVENT_PHASE: ${{ vars.EVENT_PHASE }}
          EVENT_PHASE_SP: ${{ vars.EVENT_PHASE_SP }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          SPREADSHEET_ID_DERIVATIVE: ${{ secrets.SPREADSHEET_ID_DERIVATIVE }}
          SPREADSHEET_ID_NOTES: ${{ secrets.SPREADSHEET_ID_NOTES }}
          SPREADSHEET_ID_VIDEOS: ${{ secrets.SPREADSHEET_ID_VIDEOS }}
          SPREADSHEET_ID_VOTEFORM: ${{ secrets.SPREADSHEET_ID_VOTEFORM }}
        run: |
          {
            printf 'EVENT_PHASE=%s\n' "$EVENT_PHASE"
            printf 'EVENT_PHASE_SP=%s\n' "$EVENT_PHASE_SP"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
            printf 'NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=%s\n' "$NEXT_PUBLIC_GOOGLE_ANALYTICS_ID"
            printf 'SPREADSHEET_ID_DERIVATIVE=%s\n' "$SPREADSHEET_ID_DERIVATIVE"
            printf 'SPREADSHEET_ID_NOTES=%s\n' "$SPREADSHEET_ID_NOTES"
            printf 'SPREADSHEET_ID_VIDEOS=%s\n' "$SPREADSHEET_ID_VIDEOS"
            printf 'SPREADSHEET_ID_VOTEFORM=%s\n' "$SPREADSHEET_ID_VOTEFORM"
          } > .env.production

      # CloudflareへPreviewをデプロイ
      #
      # 新しいWrangler Previewコマンドを使用する
      # PR番号をPreview名として使用することで、
      # 同じPull Requestでは常に最新のPreviewを確認できる
      - name: Deploy to Cloudflare Preview
        id: preview
        working-directory: "2026winter/frontend"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail

          output=$(npx wrangler preview \
            --name "pr-${PR_NUMBER}" \
            --json)

          printf '%s\n' "$output"

          preview_url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      # Deploymentを「成功」にする
      #
      # Cloudflareから取得したPreview URLを設定することで、
      # GitHubのDeploymentsやPull RequestからPreviewページを確認できる
      - name: Mark deployment successful
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="Preview deployment completed successfully." \
            -f environment_url="$PREVIEW_URL" \
            -F auto_inactive=false

      # 同じPull Requestに対する過去のPreview Deploymentをinactiveにする
      #
      # これにより、同じPRを複数回更新しても
      # 最新のPreview Deploymentだけがactiveになる
      - name: Mark previous deployments for this Pull Request inactive
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          CURRENT_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          deployments=$(gh api \
            --paginate \
            "/repos/${{ github.repository }}/deployments?environment=2026winter-preview&per_page=100" \
            | jq -r --arg ref "$PR_REF" \
              '.[] | select(.ref == $ref) | .id')

          for deployment_id in $deployments; do
            if [ "$deployment_id" = "$CURRENT_DEPLOYMENT_ID" ]; then
              continue
            fi

            echo "Marking previous deployment $deployment_id as inactive"

            gh api \
              --method POST \
              "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
              -f state="inactive" \
              -f description="Superseded by a newer deployment for this Pull Request." \
              -F auto_inactive=false
          done

      # Cloudflareへのデプロイなどが失敗した場合は、
      # GitHub Deploymentもfailureにする
      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="failure" \
            -f description="Preview deployment failed."

